<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SUST CSE · Class and Exam Coordination</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F7F8FA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SUST CSE" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,500&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var bridge = window.Capacitor
        var native = bridge && typeof bridge.isNativePlatform === 'function'
          ? bridge.isNativePlatform()
          : Boolean(bridge && bridge.platform && bridge.platform !== 'web')
        if (native) document.documentElement.setAttribute('data-app', 'native')
      })()
    </script>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f7f8fa;
        transition: opacity 0.25s ease;
      }
      #splash img {
        width: 96px;
        height: 96px;
        object-fit: contain;
      }
      #splash p {
        margin: 0;
        font-family: "Source Serif 4", Georgia, serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #1d4ed8;
      }
      #splash span {
        width: 34px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: #dbe6fe;
      }
      #splash span::after {
        display: block;
        width: 60%;
        height: 100%;
        border-radius: 999px;
        background: #1d4ed8;
        animation: splash-slide 1s ease-in-out infinite;
        content: "";
      }
      @keyframes splash-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(200%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash span::after {
          animation: none;
        }
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) #splash {
          background: #0e1014;
        }
        html:not([data-theme="light"]) #splash p {
          color: #93b4fb;
        }
        html:not([data-theme="light"]) #splash span {
          background: #1b2d52;
        }
        html:not([data-theme="light"]) #splash span::after {
          background: #93b4fb;
        }
      }
      html[data-theme="dark"] #splash {
        background: #0e1014;
      }
      html[data-theme="dark"] #splash p {
        color: #93b4fb;
      }
      html[data-theme="dark"] #splash span {
        background: #1b2d52;
      }
      html[data-theme="dark"] #splash span::after {
        background: #93b4fb;
      }
      html[data-app="native"] #splash {
        gap: 0;
        background: #ffffff;
      }
      html[data-app="native"] #splash p,
      html[data-app="native"] #splash span {
        display: none;
      }
      html[data-app="native"] #splash img {
        width: 112px;
        height: 112px;
        content: url("/brand/sust-logo-mark.png");
      }
      @media (prefers-color-scheme: dark) {
        html[data-app="native"]:not([data-theme="light"]) #splash {
          background: #121212;
        }
      }
      html[data-app="native"][data-theme="dark"] #splash {
        background: #121212;
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/icon-192.png" alt="" />
      <p>SUST CSE</p>
      <span></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
