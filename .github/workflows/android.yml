name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/android.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build the signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
      - name: Read the version
        id: version
        working-directory: frontend
        run: echo "name=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Install the dependencies
        working-directory: frontend
        run: npm ci
      - name: Build the pages
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.name }}
          VITE_APP_COMMIT: ${{ github.sha }}
        run: npm run build
      - name: Copy the Firebase config
        working-directory: frontend
        run: npm run android:config
      - name: Sync the Android project
        working-directory: frontend
        run: npx cap sync android
      - name: Restore the signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set in the repository secrets"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
      - name: Assemble the release APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -PappVersionName=${{ steps.version.outputs.name }} \
            -PappVersionCode=${{ github.run_number }}
      - name: Name the APK
        id: apk
        run: |
          mkdir -p dist
          cp frontend/android/app/build/outputs/apk/release/app-release.apk \
            "dist/sust-cse-portal-${{ steps.version.outputs.name }}.apk"
          echo "path=dist/sust-cse-portal-${{ steps.version.outputs.name }}.apk" >> "$GITHUB_OUTPUT"
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.keystore"
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: sust-cse-portal-${{ steps.version.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 60
          if-no-files-found: error
      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
