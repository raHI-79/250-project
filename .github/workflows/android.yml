name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this build is being run"
        required: false
        default: "Manual build"

permissions:
  contents: write

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "22"
  ANDROID_PLATFORM: "platforms;android-34"
  ANDROID_BUILD_TOOLS: "build-tools;34.0.0"

jobs:
  build:
    name: Build the signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Say why this run started
        run: echo "${{ github.event_name == 'workflow_dispatch' && inputs.reason || github.event_name }}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: "platform-tools ${{ env.ANDROID_PLATFORM }} ${{ env.ANDROID_BUILD_TOOLS }}"

      - name: Confirm the licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend/android/**/*.gradle', 'frontend/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Read the version
        id: version
        working-directory: frontend
        run: echo "name=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install the dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the pages
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.name }}
          VITE_APP_COMMIT: ${{ github.sha }}
        run: npm run build

      - name: Copy the Firebase config
        working-directory: frontend
        run: npm run android:config

      - name: Sync the Android project
        working-directory: frontend
        run: npx cap sync android

      - name: Restore the signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "These repository secrets are empty or missing:$missing"
            echo "Add them under Settings, Secrets and variables, Actions. See docs/ANDROID.md."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
          if [ ! -s "$RUNNER_TEMP/signing.keystore" ]; then
            echo "ANDROID_KEYSTORE_BASE64 did not decode into a keystore file"
            exit 1
          fi

      - name: Print the signing certificate fingerprints
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore "$RUNNER_TEMP/signing.keystore" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null \
            | grep -E "^[[:space:]]+(SHA1|SHA256):" \
            | sed -E "s/^[[:space:]]+//" \
            | tee "$RUNNER_TEMP/fingerprints.txt"
          echo "Register these in the Google Cloud Console Android OAuth client"
          echo "for package edu.sust.cse.portal. See docs/ANDROID.md."

      - name: Assemble the release APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PappVersionName=${{ steps.version.outputs.name }} \
            -PappVersionCode=${{ github.run_number }}

      - name: Name the APK
        id: apk
        run: |
          built=frontend/android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$built" ]; then
            echo "Gradle produced no signed APK at $built"
            exit 1
          fi
          mkdir -p dist
          name="sust-cse-portal-${{ steps.version.outputs.name }}.apk"
          cp "$built" "dist/$name"
          echo "path=dist/$name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.keystore"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: sust-cse-portal-${{ steps.version.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 60
          if-no-files-found: error

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
