name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sust_coord_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sust_coord_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      - name: Check the formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -timeout 25m ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  browser-shards:
    name: Browser check (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sust_coord_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: development
      PORT: '8080'
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sust_coord_e2e?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sust_coord_e2e?sslmode=disable
      JWT_SECRET: a-ci-only-secret-that-is-long-enough-for-the-config-check
      APP_TIMEZONE: Asia/Dhaka
      FRONTEND_ORIGIN: http://localhost:5173
      ADMIN_IDENTIFIER: office
      ADMIN_PASSWORD: sust-250-project
      ADMIN_EMAIL: office@sust.edu
      ADMIN_PHONE: '+8801700000000'
      SUPER_ADMIN_IDENTIFIER: chief
      DEMO_PASSWORD: sust-250-project
      E2E_BASE_URL: http://localhost:5173
      E2E_OFFICE_ID: office
      E2E_CONTROL_ID: chief
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Load the demo data
        working-directory: backend
        run: go run ./cmd/seed -demo
      - name: Start the server
        working-directory: backend
        run: |
          go run ./cmd/server > server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "the server did not come up"
          cat server.log
          exit 1
      - name: Install the frontend
        working-directory: frontend
        run: npm ci
      - name: Install the browser
        working-directory: frontend
        run: npm run e2e:install
      - name: Start the website
        working-directory: frontend
        run: |
          npm run dev > vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:5173/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "the website did not come up"
          cat vite.log
          exit 1
      - name: Walk every page
        working-directory: frontend
        run: npm run e2e -- --fully-parallel --shard=${{ matrix.shard }}/3
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check-${{ matrix.shard }}
          path: |
            frontend/e2e/.artifacts
            frontend/vite.log
            backend/server.log
          retention-days: 7

  browser:
    name: Browser check
    runs-on: ubuntu-latest
    needs: browser-shards
    if: always()
    steps:
      - name: Every shard passed
        run: |
          if [ "${{ needs.browser-shards.result }}" != "success" ]; then
            echo "a browser shard did not pass: ${{ needs.browser-shards.result }}"
            exit 1
          fi
