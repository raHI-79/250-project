name: Database backup

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

jobs:
  dump:
    name: Nightly dump
    runs-on: ubuntu-latest
    steps:
      - name: Install the PostgreSQL 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
      - name: Name the dump
        id: name
        run: echo "file=sust-cse-$(date -u +%Y-%m-%d).sql.gz" >> "$GITHUB_OUTPUT"
      - name: Dump the database
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ]; then
            echo "BACKUP_DATABASE_URL is not set in the repository secrets"
            exit 1
          fi
          pg_dump --no-owner --no-privileges "$BACKUP_DATABASE_URL" | gzip -9 > "${{ steps.name.outputs.file }}"
          ls -lh "${{ steps.name.outputs.file }}"
      - name: Encrypt the dump
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "BACKUP_PASSPHRASE is not set in the repository secrets."
            echo "Add it under Settings -> Secrets and variables -> Actions, then run this again."
            exit 1
          fi
          printf '%s' "$BACKUP_PASSPHRASE" > passphrase.txt
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase-file passphrase.txt \
            --output "${{ steps.name.outputs.file }}.gpg" "${{ steps.name.outputs.file }}"
          shred -u passphrase.txt || rm -f passphrase.txt
          rm -f "${{ steps.name.outputs.file }}"
          ls -lh "${{ steps.name.outputs.file }}.gpg"
      - name: Upload the encrypted dump
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.file }}.gpg
          path: ${{ steps.name.outputs.file }}.gpg
          retention-days: 30
          if-no-files-found: error
      - name: Tell the portal the backup worked
        env:
          BACKUP_STATUS_URL: ${{ secrets.BACKUP_STATUS_URL }}
          BACKUP_STATUS_SECRET: ${{ secrets.BACKUP_STATUS_SECRET }}
        run: |
          if [ -z "$BACKUP_STATUS_URL" ] || [ -z "$BACKUP_STATUS_SECRET" ]; then
            echo "BACKUP_STATUS_URL or BACKUP_STATUS_SECRET is not set, skipping the report"
            exit 0
          fi
          curl -fsS -X POST "$BACKUP_STATUS_URL" \
            -H "Content-Type: application/json" \
            -H "X-Backup-Secret: $BACKUP_STATUS_SECRET" \
            -d "{\"note\":\"${{ steps.name.outputs.file }}\"}" > /dev/null
