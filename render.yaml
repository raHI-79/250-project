services:
  - type: web
    name: sust-cse-portal
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    buildFilter:
      ignoredPaths:
        - docs/**
    dockerBuildArgs:
      APP_VERSION: 2.2.1
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_VERSION
        value: 2.2.1
      - key: APP_TIMEZONE
        value: Asia/Dhaka
      - key: GITHUB_RELEASES_REPO
        value: raHI-79/250-project
      - key: FILE_STORAGE
        value: database
      - key: MAIL_PROVIDER
        value: appsscript
      - key: DB_MAX_CONNS
        value: "5"
      - key: STUDENT_EMAIL_DOMAIN
        value: student.sust.edu
      - key: MAIL_FROM_NAME
        value: SUST CSE Portal
      - key: TEACHER_REMINDER_TIMES
        value: "16:00,21:00"
      - key: TEACHER_MORNING_REMINDER
        value: "07:30"
      - key: SCHEDULE_DAYS_AHEAD
        value: "7"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: JWT_TTL
        value: 24h
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_IDENTIFIER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
